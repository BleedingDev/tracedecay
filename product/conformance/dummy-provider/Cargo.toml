[package]
name = "tracedecay-memory-dummy-provider"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "MIT"
description = "Deterministic mandatory-conformance provider for TraceDecay Memory Provider V1"

[dependencies]
sha2 = { version = "0.10.9", default-features = false }

[workspace]

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
