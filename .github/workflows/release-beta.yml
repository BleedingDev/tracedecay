name: Release (Beta)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing prerelease tag to recover
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}

concurrency:
  group: release-beta-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.repository == 'ScriptedAlchemy/tracedecay' &&
      vars.BETA_CHANNEL_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.release.prerelease)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      attestations: read
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
      source_epoch: ${{ steps.source.outputs.source_epoch }}
      matrix: ${{ steps.source.outputs.matrix }}
      build_required: ${{ steps.source.outputs.build_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual prerelease recovery
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'

      - name: Resolve immutable prerelease source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          source_epoch="$(git show -s --format=%ct "$source_sha")"
          version="$(tr -d '[:space:]' < version.txt)"
          test -n "$version"
          test "$version" != "null"
          [[ "$version" == *-* ]]
          test "$RELEASE_TAG" = "v${version}"
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_sha" != "$source_sha" ]]; then
            echo "::error::${RELEASE_TAG} targets ${tag_sha}, not release source ${source_sha}"
            exit 1
          fi
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            test "$GITHUB_REF" = "refs/tags/${RELEASE_TAG}"
            test "$GITHUB_SHA" = "$source_sha"
          fi
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "source_epoch=${source_epoch}" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output "$GITHUB_OUTPUT"
          mkdir retained-assets
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "$source_sha" \
            --asset-names retained-asset-names \
            --download-dir retained-assets
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-directory retained-assets

  build:
    needs: validate
    if: needs.validate.outputs.build_required == 'true'
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          path: .release-automation
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # 3.12.10 is the newest 3.12 patch published for every release
          # matrix architecture, including macOS 14 ARM.
          python-version: "3.12.10"

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm run build

      - name: Validate portable distribution harnesses
        run: |
          python3 .release-automation/scripts/test-check-packaged-lsp-bridge.py
          python3 .release-automation/scripts/test-build-mcpb.py
          python3 .release-automation/scripts/test-resolve-installed-binary.py
          python3 .release-automation/scripts/test-check-packaged-mcp-stdio.py
          python3 .release-automation/scripts/test-check-distribution-feature-wiring.py
          python3 .release-automation/scripts/test-resolve-release-source-profile.py
          python3 .release-automation/scripts/test-package-release-archive.py
          python3 .release-automation/scripts/test-plan-release-recovery.py
          python3 .release-automation/scripts/test-check-release-artifacts.py
          python3 .release-automation/scripts/product/ncm/test-verify-installed.py
          bash .release-automation/scripts/test-check-distribution-clean-source.sh
          bash .release-automation/scripts/test-check-distribution-snapshot.sh

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@acdba816b0980ba6b63f1109f89a046e15fc301a # nextest

      - name: Resolve release source feature profile
        id: release-profile
        shell: bash
        run: |
          python3 .release-automation/scripts/resolve-release-source-profile.py \
            --source . \
            --target "${{ matrix.target }}" \
            --github-output "$GITHUB_OUTPUT"
          if [[ -f crates/tracedecay-cli/Cargo.toml ]]; then
            echo "binary_args=--package tracedecay-cli --bin tracedecay" >> "$GITHUB_OUTPUT"
          else
            echo "binary_args=--bin tracedecay" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mold
        if: runner.os == 'Linux'
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
        with:
          mold-version: 2.41.0
          make-default: true

      - name: Verify mold is the default linker
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mold --version
          ld --version | head -n 1 | grep -i mold

      - name: Use lld-link
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          where.exe lld-link
          lld-link --version
          "RUSTFLAGS=-C linker=lld-link.exe" >> $env:GITHUB_ENV

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-beta-${{ matrix.target }}
          cache-on-failure: true

      - name: Test release distribution
        if: matrix.name == 'x86_64-linux'
        run: |
          python3 .release-automation/scripts/build-controlled-workload-hotpath-helpers.py \
            --source . \
            --profile release \
            --target ${{ matrix.target }}
          cargo nextest run -p tracedecay-search-eval --release --target ${{ matrix.target }} \
            --all-features --locked \
            --run-ignored only \
            -E 'test(=controlled_workloads::tests::hotpath_off_vs_on_durable_results_are_identical)' \
            --no-tests=fail
          cargo build --workspace --bins --release --target ${{ matrix.target }} --all-features --locked
          cargo test --workspace --release --target ${{ matrix.target }} --all-features --locked

      # Runs before the default build so it never leaves an all-features
      # binary (e.g. test-transport) on disk at the shared release output
      # path for later packaging steps to pick up.
      - name: Verify all-feature release build compiles
        if: runner.os != 'Windows'
        run: cargo build ${{ steps.release-profile.outputs.binary_args }} --release --target ${{ matrix.target }} --all-features --locked

      - name: Build release binary for packaging
        run: cargo build ${{ steps.release-profile.outputs.binary_args }} --release --target ${{ matrix.target }} ${{ steps.release-profile.outputs.cargo_args }} --locked

      - name: Build NCM worker sidecar
        if: matrix.name == 'aarch64-macos'
        run: cargo build -p tracedecay-memory-ncm-runtime --bin tracedecay-ncm-worker --release --target ${{ matrix.target }} --no-default-features --features real-encoder --locked

      - name: Install modern Bash for distribution acceptance
        if: runner.os == 'macOS'
        run: brew install bash

      - name: Run distribution acceptance
        if: steps.release-profile.outputs.profile == 'production'
        shell: bash
        run: |
          set -euo pipefail
          gate_shell="bash"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            gate_shell="$(brew --prefix)/bin/bash"
          fi
          # The gate runs Cargo offline so packaging and the packaged-crate
          # builds prove the checked-in lockfile resolves without the network.
          cargo fetch --locked --target ${{ matrix.target }}
          lockfile_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          CARGO_NET_OFFLINE=true \
            "$gate_shell" scripts/check-distribution-acceptance.sh
          actual_lockfile_sha="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          test "$actual_lockfile_sha" = "$lockfile_sha"

      - name: Run historical release binary smoke
        if: steps.release-profile.outputs.profile == 'legacy-default'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          test -f "$binary"
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Package MCPB
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            binary="${binary}.exe"
          fi
          bundle="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.mcpb"
          python3 .release-automation/scripts/build-mcpb.py build \
            --binary "$binary" \
            --output "$bundle" \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.name }}"
          python3 .release-automation/scripts/build-mcpb.py verify \
            --bundle "$bundle" \
            --version "${{ steps.version.outputs.version }}" \
            --platform "${{ matrix.name }}"

      - name: Verify MCPB runtime (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.mcpb"
          rm -rf verify-mcpb
          python3 -m zipfile -e "$bundle" verify-mcpb
          test -x verify-mcpb/server/tracedecay
          verify-mcpb/server/tracedecay --version
          verify-mcpb/server/tracedecay --help >/dev/null

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.mcpb
          if-no-files-found: error

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          source="target/${{ matrix.target }}/release/tracedecay"
          entry_name="tracedecay"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source="${source}.exe"
            entry_name="${entry_name}.exe"
          fi
          python3 .release-automation/scripts/package-release-archive.py \
            --binary "$source" \
            --output "tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.${{ matrix.archive }}" \
            --format "${{ matrix.archive }}" \
            --entry-name "$entry_name" \
            --epoch "${{ needs.validate.outputs.source_epoch }}"

      - name: Package NCM worker sidecar
        if: matrix.name == 'aarch64-macos'
        shell: bash
        run: |
          set -euo pipefail
          worker="target/${{ matrix.target }}/release/tracedecay-ncm-worker"
          manifest="product/ncm/reference/worker-manifest.json"
          model_manifest="product/ncm/release/model-acquisition-manifest.json"
          archive="tracedecay-ncm-worker-beta-${RELEASE_TAG}-${{ matrix.name }}.tar.gz"
          test -x "$worker"
          test -s "$manifest"
          test -s "$model_manifest"
          python3 .release-automation/scripts/package-release-archive.py \
            --binary "$worker" \
            --output "$archive" \
            --format tar.gz \
            --entry-name tracedecay-ncm-worker \
            --epoch "${{ needs.validate.outputs.source_epoch }}" \
            --companion "$manifest=worker-manifest.json" \
            --companion "$model_manifest=model-acquisition-manifest.json"
          rm -rf verify-ncm-worker
          mkdir verify-ncm-worker
          tar xzf "$archive" -C verify-ncm-worker
          test -x verify-ncm-worker/tracedecay-ncm-worker
          cmp "$manifest" verify-ncm-worker/worker-manifest.json
          cmp "$model_manifest" verify-ncm-worker/model-acquisition-manifest.json
          python3 - "$manifest" "$worker" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          worker_path = pathlib.Path(sys.argv[2])
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          target = next(
              item
              for item in manifest["targets"]
              if item["triple"] == "aarch64-apple-darwin"
          )
          payload = worker_path.read_bytes()
          if len(payload) != target["bytes"]:
              raise SystemExit(
                  f"worker byte count mismatch: {len(payload)} != {target['bytes']}"
              )
          digest = hashlib.sha256(payload).hexdigest()
          if digest != target["sha256"]:
              raise SystemExit(
                  f"worker SHA-256 mismatch: {digest} != {target['sha256']}"
              )
          PY
          shasum -a 256 "$archive" > "$archive.sha256"
          binary="target/${{ matrix.target }}/release/tracedecay"
          binary_sha256="$(shasum -a 256 "$binary" | awk '{print $1}')"
          archive_sha256="$(shasum -a 256 "tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.${{ matrix.archive }}" | awk '{print $1}')"
          python3 .release-automation/scripts/product/ncm/verify-installed.py \
            --binary-archive "tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.${{ matrix.archive }}" \
            --worker-archive "$archive" \
            --binary "$binary" \
            --target "${{ matrix.target }}" \
            --release-name "${{ matrix.name }}" \
            --profile beta \
            --expected-version "${RELEASE_TAG#v}" \
            --expected-source-sha "${{ needs.validate.outputs.source_sha }}" \
            --expected-archive-sha256 "$archive_sha256" \
            --expected-binary-sha256 "$binary_sha256" \
            --manifest .release-automation/product/ncm/release/model-acquisition-manifest.json \
            --embedding-manifest .release-automation/product/ncm/reference/embedding-manifest.json \
            --worker-manifest .release-automation/product/ncm/reference/worker-manifest.json \
            --revision-receipt .release-automation/product/ncm/receipts/backend/2fc72f1d81f543224d8e7d8ef19195b026ba855f.json \
            --model-root "${RUNNER_TEMP}/ncm-release-model-root" \
            --operation install \
            --installed-e2e

      - name: Verify binary archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          archive="tracedecay-beta-${RELEASE_TAG}-${{ matrix.name }}.tar.gz"
          archive_sha256="$(shasum -a 256 "$archive" | awk '{print $1}')"
          python3 .release-automation/scripts/product/ncm/verify-installed.py \
            --binary-archive "$archive" \
            --target "${{ matrix.target }}" \
            --release-name "${{ matrix.name }}" \
            --profile beta \
            --expected-version "${RELEASE_TAG#v}" \
            --expected-source-sha "${{ needs.validate.outputs.source_sha }}" \
            --expected-archive-sha256 "$archive_sha256"

      - name: Verify binary archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $archive = "tracedecay-beta-${env:RELEASE_TAG}-${{ matrix.name }}.zip"
          $archiveSha = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          $version = $env:RELEASE_TAG.Substring(1)
          python3 .release-automation/scripts/product/ncm/verify-installed.py `
            --binary-archive $archive `
            --target "${{ matrix.target }}" `
            --release-name "${{ matrix.name }}" `
            --profile beta `
            --expected-version $version `
            --expected-source-sha "${{ needs.validate.outputs.source_sha }}" `
            --expected-archive-sha256 $archiveSha

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-beta-${{ matrix.name }}
          path: tracedecay-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.name == 'aarch64-macos'
        with:
          name: ncm-worker-beta-${{ matrix.name }}
          path: |
            tracedecay-ncm-worker-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz
            tracedecay-ncm-worker-beta-${{ env.RELEASE_TAG }}-${{ matrix.name }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [validate, build]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: binary-beta-*
          path: new-binaries
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: mcpb-beta-*
          path: new-mcpbs
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.validate.outputs.build_required == 'true'
        with:
          pattern: ncm-worker-beta-*
          path: new-ncm-workers
          merge-multiple: true

      - name: Assemble retained and newly built prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'
          mkdir binaries mcpbs ncm-workers retained-assets
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-names remote-asset-names \
            --retained-output retained-asset-names \
            --github-output planner-output
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "$SOURCE_SHA" \
            --asset-names retained-asset-names \
            --download-dir retained-assets
          python3 scripts/plan-release-recovery.py \
            --manifest .github/release-targets.json \
            --tag "$RELEASE_TAG" \
            --profile beta \
            --asset-directory retained-assets
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            if [[ "$asset" == tracedecay-ncm-worker-beta-*.tar.gz* ]]; then
              cp "retained-assets/$asset" "ncm-workers/$asset"
            elif [[ "$asset" == *.mcpb ]]; then
              cp "retained-assets/$asset" "mcpbs/$asset"
            else
              cp "retained-assets/$asset" "binaries/$asset"
            fi
          done < retained-asset-names
          if [[ "${{ needs.validate.outputs.build_required }}" == "true" ]]; then
            for artifact in new-binaries/tracedecay-beta-*; do
              destination="binaries/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
            for artifact in new-mcpbs/*.mcpb; do
              destination="mcpbs/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
            for artifact in new-ncm-workers/tracedecay-ncm-worker-beta-*; do
              [[ -e "$artifact" ]] || continue
              destination="ncm-workers/$(basename "$artifact")"
              [[ -e "$destination" ]] || cp "$artifact" "$destination"
            done
          fi
          python3 scripts/check-release-artifacts.py \
            --manifest .github/release-targets.json \
            --profile beta \
            --tag "$RELEASE_TAG" \
            --binaries binaries \
            --mcpbs mcpbs \
            --sidecars ncm-workers \
            --worker-manifest product/ncm/reference/worker-manifest.json \
            --model-acquisition-manifest product/ncm/release/model-acquisition-manifest.json \
            --model-revision-receipt product/ncm/receipts/backend/2fc72f1d81f543224d8e7d8ef19195b026ba855f.json
          for bundle in mcpbs/*.mcpb; do
            platform="${bundle#mcpbs/tracedecay-beta-"${RELEASE_TAG}"-}"
            platform="${platform%.mcpb}"
            python3 scripts/build-mcpb.py verify \
              --bundle "$bundle" \
              --version "${RELEASE_TAG#v}" \
              --platform "$platform"
          done

      - name: Attest newly built prerelease archives
        if: needs.validate.outputs.build_required == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-binaries/tracedecay-beta-*

      - name: Attest newly built prerelease MCPBs
        if: needs.validate.outputs.build_required == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-mcpbs/*.mcpb

      - name: Attest newly built prerelease NCM worker sidecars
        if: needs.validate.outputs.build_required == 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: new-ncm-workers/tracedecay-ncm-worker-beta-*

      - name: Upload missing prerelease assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (
            cd binaries
            sha256sum tracedecay-beta-* > ../SHA256SUMS
          )
          (
            cd mcpbs
            sha256sum -- *.mcpb
          ) >> SHA256SUMS
          (
            cd ncm-workers
            sha256sum -- *.tar.gz
          ) >> SHA256SUMS
          mapfile -t archives < <(find binaries -maxdepth 1 -type f -name 'tracedecay-beta-*' -print | sort)
          test "${#archives[@]}" -gt 0
          mapfile -t bundles < <(find mcpbs -maxdepth 1 -type f -name '*.mcpb' -print | sort)
          test "${#bundles[@]}" -gt 0
          mapfile -t sidecar_archives < <(find ncm-workers -maxdepth 1 -type f -name 'tracedecay-ncm-worker-beta-*.tar.gz' -print | sort)
          test "${#sidecar_archives[@]}" -gt 0
          mapfile -t sidecar_checksums < <(find ncm-workers -maxdepth 1 -type f -name 'tracedecay-ncm-worker-beta-*.tar.gz.sha256' -print | sort)
          test "${#sidecar_checksums[@]}" -gt 0
          release_assets=("${archives[@]}" "${bundles[@]}" "${sidecar_archives[@]}" "${sidecar_checksums[@]}" SHA256SUMS)
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'
          gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" \
            --jq '.assets[].name' > remote-asset-names
          test "$(gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft,isPrerelease --jq '[.isPrerelease, .isDraft] | @tsv')" = $'true\tfalse'
          for release_asset in "${release_assets[@]}"; do
            name="$(basename "$release_asset")"
            if grep -Fxq "$name" remote-asset-names; then
              if [[ "$name" == "SHA256SUMS" ]]; then
                mkdir -p retained-metadata
                gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
                  --pattern "$name" --dir retained-metadata
                cmp -s "$release_asset" "retained-metadata/$name"
              fi
            else
              gh release upload "$RELEASE_TAG" "$release_asset" \
                --repo "${{ github.repository }}"
            fi
          done
          mkdir verified-binaries verified-mcpbs verified-ncm-workers
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-beta-${RELEASE_TAG}-*.tar.gz" \
            --dir verified-binaries
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-beta-${RELEASE_TAG}-*.zip" \
            --dir verified-binaries
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-beta-${RELEASE_TAG}-*.mcpb" \
            --dir verified-mcpbs
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-ncm-worker-beta-${RELEASE_TAG}-*.tar.gz" \
            --dir verified-ncm-workers
          gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" \
            --pattern "tracedecay-ncm-worker-beta-${RELEASE_TAG}-*.tar.gz.sha256" \
            --dir verified-ncm-workers
          python3 scripts/check-release-artifacts.py \
            --manifest .github/release-targets.json \
            --profile beta \
            --tag "$RELEASE_TAG" \
            --binaries verified-binaries \
            --mcpbs verified-mcpbs \
            --sidecars verified-ncm-workers \
            --worker-manifest product/ncm/reference/worker-manifest.json \
            --model-acquisition-manifest product/ncm/release/model-acquisition-manifest.json \
            --model-revision-receipt product/ncm/receipts/backend/2fc72f1d81f543224d8e7d8ef19195b026ba855f.json
          scripts/verify-retained-release-assets.sh \
            --tag "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --signer-workflow "${{ github.repository }}/.github/workflows/release-beta.yml" \
            --source-digest "${{ needs.validate.outputs.source_sha }}" \
            --files verified-binaries/* verified-mcpbs/* verified-ncm-workers/*
