name: Validate tdmem-0305 memory conformance

on:
  push:
    branches:
      - agent/tdmem-0305-conformance
    paths:
      - crates/tracedecay-memory-conformance/**
      - .github/workflows/tdmem-0305-scratch.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize conformance crate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          marker = '    "crates/tracedecay-memory-provider-native",\n'
          member = '    "crates/tracedecay-memory-conformance",\n'
          if member not in text:
              if marker not in text:
                  raise SystemExit("workspace marker missing")
              path.write_text(text.replace(marker, marker + member, 1), encoding="utf-8")
          PY
          cargo fmt --package tracedecay-memory-conformance
          git checkout -- Cargo.toml
          if ! git diff --quiet -- crates/tracedecay-memory-conformance; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add crates/tracedecay-memory-conformance
            git commit -m 'style(memory): normalize conformance crate'
            git push origin HEAD:agent/tdmem-0305-conformance
          fi
      - name: Register scratch workspace member
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          marker = '    "crates/tracedecay-memory-provider-native",\n'
          member = '    "crates/tracedecay-memory-conformance",\n'
          if member not in text:
              if marker not in text:
                  raise SystemExit("workspace marker missing")
              path.write_text(text.replace(marker, marker + member, 1), encoding="utf-8")
          PY
      - name: Format
        run: cargo fmt --package tracedecay-memory-conformance -- --check
      - name: Strict Clippy
        run: cargo clippy -p tracedecay-memory-conformance --all-targets -- -D warnings
      - name: Focused tests
        run: cargo test -p tracedecay-memory-conformance
