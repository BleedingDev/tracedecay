name: Apply one Beads operation

on:
  push:
    branches:
      - feat/pluggable-memory-providers-v2
    paths:
      - .beads/operations/pending/**
      - .beads/apply_operation.py
      - .beads/apply_operation_compat.py
      - .beads/policy.yaml
      - .github/workflows/apply-beads-operation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-beads-operation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      BR_VERSION: 0.5.7
      BR_ARCHIVE_SHA256: 634aaacd0aac256b2be7250af9fe1e863e8a0316875c20959a6a1c2da75bf843
    steps:
      - name: Check out the exact product branch
        uses: actions/checkout@v4
        with:
          ref: feat/pluggable-memory-providers-v2
          fetch-depth: 0

      - name: Install pinned Beads Rust
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/br-${BR_VERSION}-linux_amd64.tar.gz"
          extract_dir="${RUNNER_TEMP}/br-${BR_VERSION}"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/Dicklesworthstone/beads_rust/releases/download/v${BR_VERSION}/br-${BR_VERSION}-linux_amd64.tar.gz"
          echo "${BR_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$extract_dir" "${HOME}/.local/bin"
          tar -xzf "$archive" -C "$extract_dir"
          binary="$(find "$extract_dir" -type f -name br -perm -111 -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" "${HOME}/.local/bin/br"
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/br" --version

      - name: Materialize and commit prepared product files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t pending_paths < <(
            find .beads/operations/pending -maxdepth 1 -type f -name '*.json' -print 2>/dev/null \
              | sort
          )
          if [[ ${#pending_paths[@]} -ne 1 ]]; then
            printf 'expected exactly one pending operation, found %s\n' "${#pending_paths[@]}" >&2
            printf '%s\n' "${pending_paths[@]}" >&2
            exit 1
          fi
          issue_id="$(python3 - "${pending_paths[0]}" <<'PY'
          import json
          import pathlib
          import sys

          value = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          issue_id = value.get("issue_id")
          if not isinstance(issue_id, str) or not issue_id:
              raise SystemExit("pending operation has no issue_id")
          print(issue_id)
          PY
          )"
          prepare_script=".beads/operations/prepare/${issue_id}.py"
          if [[ ! -f "$prepare_script" ]]; then
            echo "no prepared product files for ${issue_id}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 "$prepare_script"
          manifest='.beads/operations/prepared-files.json'
          test -f "$manifest"

          python3 - "$manifest" "$prepare_script" "$issue_id" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          manifest_path = pathlib.Path(sys.argv[1])
          prepare_script = pathlib.Path(sys.argv[2])
          issue_id = sys.argv[3]
          rows = json.loads(manifest_path.read_text(encoding="utf-8"))
          if not isinstance(rows, list) or not rows:
              raise SystemExit("prepared file manifest must contain at least one entry")

          seen: set[str] = set()
          for index, row in enumerate(rows):
              if not isinstance(row, dict) or set(row) != {"path", "message"}:
                  raise SystemExit(f"invalid prepared file manifest entry {index}")
              path = row["path"]
              message = row["message"]
              if not isinstance(path, str) or not path or path in seen:
                  raise SystemExit(f"invalid or duplicate prepared path at entry {index}")
              if not isinstance(message, str) or not message.strip():
                  raise SystemExit(f"invalid commit message at entry {index}")
              seen.add(path)
              subprocess.run(["git", "add", "--", path], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  raise SystemExit(f"prepared path produced no change: {path}")
              subprocess.run(["git", "commit", "-m", message], check=True)

          manifest_path.unlink()
          subprocess.run(["git", "add", "-u", "--", str(prepare_script)], check=True)
          if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
              raise SystemExit("prepared materializer did not retire itself")
          subprocess.run(
              ["git", "commit", "-m", f"chore(beads): retire {issue_id} materializer"],
              check=True,
          )
          if subprocess.run(["git", "status", "--porcelain"]).stdout:
              raise SystemExit("prepared materialization left working-tree changes")
          PY

      - name: Apply the single pending operation
        run: python3 .beads/apply_operation_compat.py

      - name: Reject whitespace damage
        run: git diff --check

      - name: Commit versioned Beads state and evidence
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t receipt_paths < <(
            git status --porcelain --untracked-files=all -- .beads/receipts \
              | awk '{print $2}'
          )
          if [[ ${#receipt_paths[@]} -ne 1 ]]; then
            printf 'expected one changed receipt, found %s\n' "${#receipt_paths[@]}" >&2
            printf '%s\n' "${receipt_paths[@]}" >&2
            exit 1
          fi
          issue_id="$(basename "${receipt_paths[0]}" .json)"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .beads/issues.jsonl \
            .beads/materialize.py \
            .beads/plan \
            .beads/operations \
            .beads/receipts
          git diff --cached --quiet && {
            echo 'operation produced no versioned changes' >&2
            exit 1
          }
          git commit -m "chore(beads): apply ${issue_id} operation"

          branch='feat/pluggable-memory-providers-v2'
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "failed to publish Beads operation after ${attempt} attempts" >&2
              exit 1
            fi
            git fetch origin "$branch"
            if ! git rebase "origin/${branch}"; then
              git rebase --abort || true
              echo 'concurrent branch changes conflict with the Beads receipt; manual review required' >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
