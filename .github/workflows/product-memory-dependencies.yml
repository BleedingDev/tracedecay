name: Product memory dependency policy

# No path filter: the footprint checker classifies every diffed path against
# the convergence map, so the lane must run on every change — a path filter
# would let an unmapped edit to an upstream-owned source file skip detection.
on:
  push:
    branches:
      - feat/pluggable-memory-providers-v2
  pull_request:

permissions:
  contents: read

jobs:
  dependency-direction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate dependency policy fixtures
        run: python3 tests/product_memory_dependency_policy_test.py
      - name: Validate real workspace dependency graph
        run: >-
          python3 scripts/product/check-memory-dependency-policy.py
          --repo .
          --policy product/upstream/patch-footprint-policy.json
      - name: Validate upstream footprint policy
        run: >-
          python3 scripts/product/check-patch-footprint-policy.py
          --repo .
          --policy product/upstream/patch-footprint-policy.json
          --map product/upstream/convergence-map.json
      - name: Resolve locked workspace graph
        run: cargo metadata --locked --format-version 1 --no-deps
