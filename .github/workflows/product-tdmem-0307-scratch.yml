name: Validate tdmem-0307 default-off composition

on:
  push:
    branches:
      - agent/tdmem-0307-composition
    paths:
      - crates/tracedecay/Cargo.toml
      - crates/tracedecay/src/lib.rs
      - crates/tracedecay/src/memory_provider_composition.rs
      - crates/tracedecay/tests/product_memory_provider/composition.rs
      - Cargo.lock
      - product/upstream/patch-footprint-policy.json
      - product/upstream/convergence-map.json
      - tests/product_memory_composition_feature_test.py
      - .github/workflows/product-tdmem-0307-scratch.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize default-off root wiring
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import fnmatch
          import json
          import subprocess
          from pathlib import Path

          ROOT = Path(".")
          FLOOR = "08fbe33a7c7f403191fd5d6e356c7b6681b96403"

          def run(*argv: str) -> str:
              return subprocess.run(
                  list(argv),
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          manifest_path = ROOT / "crates/tracedecay/Cargo.toml"
          manifest = manifest_path.read_text(encoding="utf-8")
          feature = '''# Product-owned Memory Fabric composition. Default-off: neither `default` nor
          # `production` includes it, and feature enablement alone performs no runtime mount.
          memory-provider-fabric = [
              "dep:tracedecay-memory-fabric",
              "dep:tracedecay-memory-provider-api",
              "dep:tracedecay-memory-provider-native",
          ]

          '''
          if "memory-provider-fabric = [" not in manifest:
              marker = 'default = ["production"]\n\n'
              if marker not in manifest:
                  raise SystemExit("default feature marker missing")
              manifest = manifest.replace(marker, marker + feature, 1)

          dependencies = '''tracedecay-memory-fabric = { path = "../tracedecay-memory-fabric", version = "0.1.0", optional = true }
          tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api", version = "0.1.0", optional = true }
          tracedecay-memory-provider-native = { path = "../tracedecay-memory-provider-native", version = "0.1.0", optional = true }
          '''
          if "tracedecay-memory-fabric = {" not in manifest:
              marker = 'tracedecay-maintenance = { path = "../tracedecay-maintenance", version = "0.1.0" }\n'
              if marker not in manifest:
                  raise SystemExit("dependency marker missing")
              manifest = manifest.replace(marker, marker + dependencies, 1)

          target = '''[[test]]
          name = "memory_provider_composition"
          path = "tests/product_memory_provider/composition.rs"
          required-features = ["memory-provider-fabric"]

          '''
          if 'name = "memory_provider_composition"' not in manifest:
              marker = '[lib]\nname = "tracedecay"\n'
              if marker not in manifest:
                  raise SystemExit("library target marker missing")
              manifest = manifest.replace(marker, target + marker, 1)
          manifest_path.write_text(manifest, encoding="utf-8")

          lib_path = ROOT / "crates/tracedecay/src/lib.rs"
          library = lib_path.read_text(encoding="utf-8")
          if "mod memory_provider_composition;" not in library:
              marker = "mod runtime_ports;\npub use runtime_ports::register_runtime_ports;"
              replacement = '''#[cfg(feature = "memory-provider-fabric")]
          mod memory_provider_composition;
          #[cfg(feature = "memory-provider-fabric")]
          pub use memory_provider_composition::{
              FabricError, MemoryFabric, NativeMemoryApplicationPort, NativeMemoryFabricConfig,
              NativeMemoryFabricMount, NativeMemoryMode, NativeMemoryMountError, ProviderMode,
              ProviderStatus, compose_native_memory_fabric,
          };
          mod runtime_ports;
          pub use runtime_ports::register_runtime_ports;'''
              if marker not in library:
                  raise SystemExit("runtime port marker missing")
              library = library.replace(marker, replacement, 1)
          lib_path.write_text(library, encoding="utf-8")

          policy_path = ROOT / "product/upstream/patch-footprint-policy.json"
          policy = json.loads(policy_path.read_text(encoding="utf-8"))
          touch = next(
              row
              for row in policy["allowed_touch_points"]
              if row["id"] == "daemon_composition_mount"
          )
          for path in (
              "crates/tracedecay/Cargo.toml",
              "crates/tracedecay/src/lib.rs",
              "crates/tracedecay/src/memory_provider_composition.rs",
          ):
              if path not in touch["paths"]:
                  touch["paths"].append(path)
          change = "gate explicit product-owned Memory Fabric construction behind a default-off root feature"
          if change not in touch["allowed_changes"]:
              touch["allowed_changes"].append(change)
          policy_path.write_text(
              json.dumps(policy, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          convergence_path = ROOT / "product/upstream/convergence-map.json"
          convergence = json.loads(convergence_path.read_text(encoding="utf-8"))
          entries = {row["path"]: row for row in convergence["entries"]}
          lock_entry = entries["Cargo.lock"]
          if "tdmem-0307" not in lock_entry["bead_ids"]:
              lock_entry["bead_ids"].append("tdmem-0307")
          for command in (
              "cargo check -p tracedecay --no-default-features --lib --locked",
              "cargo check -p tracedecay --no-default-features --features memory-provider-fabric --lib --locked",
              "cargo test -p tracedecay --no-default-features --features memory-provider-fabric --test memory_provider_composition --locked",
          ):
              if command not in lock_entry["verification"]:
                  lock_entry["verification"].append(command)

          new_entries = [
              {
                  "path": "crates/tracedecay/Cargo.toml",
                  "touch_point": "daemon_composition_mount",
                  "rationale": "Declare one opt-in root feature and optional product-owned dependencies so ordinary and production builds cannot construct Memory Fabric infrastructure.",
                  "semantic_invariants": [
                      "The default and production feature sets exclude memory-provider-fabric.",
                      "All Memory Fabric dependencies are optional and activated only by the explicit feature.",
                      "The root package remains the only composition layer permitted to know the concrete Native adapter.",
                  ],
                  "verification": [
                      "python3 tests/product_memory_composition_feature_test.py",
                      "cargo tree -p tracedecay --no-default-features -e normal --prefix none --locked",
                      "cargo check -p tracedecay --no-default-features --features memory-provider-fabric --lib --locked",
                  ],
                  "bead_ids": ["tdmem-0307"],
                  "line_budget": 48,
                  "rebase_or_removal_plan": "Remove the feature, optional dependency declarations, and dedicated integration-test target without changing any existing production feature.",
                  "status": "active",
              },
              {
                  "path": "crates/tracedecay/src/lib.rs",
                  "touch_point": "daemon_composition_mount",
                  "rationale": "Expose the explicit feature-gated mount while leaving the existing register_runtime_ports path byte-for-byte independent of Memory Fabric.",
                  "semantic_invariants": [
                      "No default runtime registration calls the Memory Fabric composition function.",
                      "The module and its public seam do not exist when memory-provider-fabric is disabled.",
                      "Existing public modules and runtime-port registration remain unchanged.",
                  ],
                  "verification": [
                      "python3 tests/product_memory_composition_feature_test.py",
                      "cargo check -p tracedecay --no-default-features --lib --locked",
                      "cargo check -p tracedecay --no-default-features --features memory-provider-fabric --lib --locked",
                  ],
                  "bead_ids": ["tdmem-0307"],
                  "line_budget": 24,
                  "rebase_or_removal_plan": "Delete only the cfg-gated module declaration and re-export block.",
                  "status": "active",
              },
              {
                  "path": "crates/tracedecay/src/memory_provider_composition.rs",
                  "touch_point": "daemon_composition_mount",
                  "rationale": "Construct one finite provider-neutral fabric and one Native adapter only after an explicit caller supplies the existing Native application authority.",
                  "semantic_invariants": [
                      "Feature enablement alone starts no thread, queue, global registration, catalog mutation, context contribution, or state creation.",
                      "Disabled behavior is represented by absence of the feature and mount call, so no disabled configuration can instantiate provider infrastructure.",
                      "The concrete NativeProvider remains private to the composition module and host routes receive only provider-neutral fabric types.",
                      "Invalid revision or resource limits fail before the Native authority is inspected.",
                  ],
                  "verification": [
                      "cargo clippy -p tracedecay --no-default-features --features memory-provider-fabric --lib --test memory_provider_composition --locked -- -D warnings",
                      "cargo test -p tracedecay --no-default-features --features memory-provider-fabric --test memory_provider_composition --locked",
                      "python3 tests/product_memory_composition_feature_test.py",
                  ],
                  "bead_ids": ["tdmem-0307"],
                  "line_budget": 180,
                  "rebase_or_removal_plan": "Delete the isolated module; no provider state, migration, host route, or public transport schema remains.",
                  "status": "active",
              },
          ]
          for entry in new_entries:
              if entry["path"] not in entries:
                  convergence["entries"].append(entry)
                  entries[entry["path"]] = entry
          convergence_path.write_text(
              json.dumps(convergence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          cargo metadata --format-version 1 --no-deps >/dev/null
          rustfmt --edition 2024 \
            crates/tracedecay/src/memory_provider_composition.rs \
            crates/tracedecay/tests/product_memory_provider/composition.rs

          python3 - <<'PY'
          from __future__ import annotations

          import fnmatch
          import json
          import subprocess
          from pathlib import Path

          FLOOR = "08fbe33a7c7f403191fd5d6e356c7b6681b96403"
          policy = json.loads(
              Path("product/upstream/patch-footprint-policy.json").read_text(
                  encoding="utf-8"
              )
          )
          convergence_path = Path("product/upstream/convergence-map.json")
          convergence = json.loads(convergence_path.read_text(encoding="utf-8"))
          patterns = [
              value
              for value in policy["product_owned_paths"]
              if isinstance(value, str)
          ]

          def product_owned(path: str) -> bool:
              return any(fnmatch.fnmatchcase(path, pattern) for pattern in patterns)

          def is_test_or_fixture(path: str) -> bool:
              name = Path(path).name.lower()
              return (
                  path.startswith("tests/")
                  or "/tests/" in path
                  or "/test/" in path
                  or "fixture" in name
                  or name.endswith("_test.rs")
                  or name.endswith("_tests.rs")
                  or name.startswith("test_")
              )

          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--no-renames",
                  "--numstat",
                  FLOOR,
                  "--",
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          rows: dict[str, tuple[int, int]] = {}
          for line in result.stdout.splitlines():
              if not line:
                  continue
              added, deleted, path = line.split("\t", 2)
              if added == "-" or deleted == "-":
                  raise SystemExit(f"binary diff is unsupported: {path}")
              if not product_owned(path):
                  rows[path] = (int(added), int(deleted))

          entries = {row["path"]: row for row in convergence["entries"]}
          production = sum(not is_test_or_fixture(path) for path in rows)
          tests = sum(is_test_or_fixture(path) for path in rows)
          total_lines = sum(added + deleted for added, deleted in rows.values())
          composition = sum(
              entries.get(path, {}).get("touch_point") == "daemon_composition_mount"
              for path in rows
          )
          exceptions = sum(
              entries.get(path, {}).get("touch_point") == "exception"
              for path in rows
          )
          convergence["snapshot"].update(
              {
                  "upstream_existing_production_files": production,
                  "upstream_existing_test_or_fixture_files": tests,
                  "total_upstream_changed_lines": total_lines,
                  "composition_root_files": composition,
                  "exception_zone_files": exceptions,
                  "observed_state": (
                      "M2 adds one default-off, explicit root composition seam. "
                      "Ordinary and production builds retain no Memory Fabric dependencies "
                      "or runtime mount; the opt-in path constructs one bounded fabric and "
                      "keeps the concrete Native adapter private."
                  ),
              }
          )
          convergence_path.write_text(
              json.dumps(convergence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git diff --check
          python3 scripts/product/check-patch-footprint-policy.py \
            --repo . \
            --policy product/upstream/patch-footprint-policy.json \
            --map product/upstream/convergence-map.json
          python3 scripts/product/check-memory-dependency-direction.py \
            --repo . \
            --policy product/architecture/memory-dependency-policy.json
          python3 scripts/product/check-memory-dependency-policy.py \
            --repo . \
            --policy product/upstream/patch-footprint-policy.json

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              Cargo.lock \
              crates/tracedecay/Cargo.toml \
              crates/tracedecay/src/lib.rs \
              crates/tracedecay/src/memory_provider_composition.rs \
              crates/tracedecay/tests/product_memory_provider/composition.rs \
              product/upstream/patch-footprint-policy.json \
              product/upstream/convergence-map.json
            git commit -m 'feat(memory): stage default-off composition mount'
            git push origin HEAD:agent/tdmem-0307-composition
          fi

      - name: Prove feature and source isolation
        run: |
          python3 -m py_compile tests/product_memory_composition_feature_test.py
          python3 tests/product_memory_composition_feature_test.py
          rustfmt --edition 2024 --check \
            crates/tracedecay/src/memory_provider_composition.rs \
            crates/tracedecay/tests/product_memory_provider/composition.rs

      - name: Prove default graph excludes Memory Fabric
        run: |
          cargo tree -p tracedecay --no-default-features -e normal --prefix none --locked \
            > /tmp/default-tree.txt
          if grep -q 'tracedecay-memory-' /tmp/default-tree.txt; then
            cat /tmp/default-tree.txt
            echo 'default-off graph unexpectedly contains Memory Fabric crates' >&2
            exit 1
          fi

      - name: Prove enabled graph contains only explicit memory crates
        run: |
          cargo tree -p tracedecay --no-default-features \
            --features memory-provider-fabric -e normal --prefix none --locked \
            > /tmp/enabled-tree.txt
          for package in \
            tracedecay-memory-provider-api \
            tracedecay-memory-fabric \
            tracedecay-memory-provider-native
          do
            grep -q "^${package} " /tmp/enabled-tree.txt
          done

      - name: Check default-off root library
        run: cargo check -p tracedecay --no-default-features --lib --locked

      - name: Check and lint enabled composition
        run: |
          cargo check -p tracedecay --no-default-features \
            --features memory-provider-fabric --lib --locked
          cargo clippy -p tracedecay --no-default-features \
            --features memory-provider-fabric \
            --lib --test memory_provider_composition --locked -- -D warnings

      - name: Run focused composition journeys
        run: >-
          cargo test -p tracedecay
          --no-default-features
          --features memory-provider-fabric
          --test memory_provider_composition
          --locked

      - name: Re-run architecture and footprint gates
        run: |
          python3 scripts/product/check-memory-dependency-direction.py \
            --repo . \
            --policy product/architecture/memory-dependency-policy.json
          python3 scripts/product/check-memory-dependency-policy.py \
            --repo . \
            --policy product/upstream/patch-footprint-policy.json
          python3 scripts/product/check-patch-footprint-policy.py \
            --repo . \
            --policy product/upstream/patch-footprint-policy.json \
            --map product/upstream/convergence-map.json
          git diff --check
