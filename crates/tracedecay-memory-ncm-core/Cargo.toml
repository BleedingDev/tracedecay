[package]
name = "tracedecay-memory-ncm-core"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Pure Rust Biomem-derived NCM kernel: projections, associative centers, terrain, dynamics, consolidation, records"
repository = "https://github.com/BleedingDev/tracedecay"

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
