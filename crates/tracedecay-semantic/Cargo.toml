[package]
name = "tracedecay-semantic"
version = "0.1.0"
publish = false
edition.workspace = true
license = "MIT"
repository = "https://github.com/ScriptedAlchemy/tracedecay"
description = "TraceDecay semantic code runtime: artifact store, model lifecycle, and embedding projection"
include = ["/src/**"]

[dependencies]
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
fs2 = "0.4"
getrandom = "0.2"
hex = "0.4"
hotpath.workspace = true
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
tracedecay-code-index = { path = "../tracedecay-code-index", version = "0.1.0", default-features = false }
tracedecay-query = { path = "../tracedecay-query", version = "0.1.0" }
tracedecay-runtime-core = { path = "../tracedecay-runtime-core", version = "0.1.0" }
tracedecay-semantic-contracts.workspace = true
url = "2"
hf-hub = { version = "0.5", optional = true, default-features = false, features = ["ureq", "rustls-tls"] }

[target.'cfg(not(windows))'.dependencies]
# FastEmbed is optional so Windows builds expose the typed unavailable
# runtime. The adapter itself only accepts bytes from the verified local
# artifact store; FastEmbed's hub/image defaults stay disabled.
fastembed = { version = "=6.0.3", optional = true, default-features = false }

[features]
hotpath = ["hotpath/hotpath"]
semantic-fastembed = [
    "dep:fastembed",
    "dep:hf-hub",
    "fastembed/ort-download-binaries-rustls-tls",
    "fastembed/hf-hub-rustls-tls",
]
test-helpers = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
