[package]
name = "tracedecay-memory-fabric"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Bounded capability-driven orchestration for TraceDecay cognitive memory providers"
repository = "https://github.com/BleedingDev/tracedecay"

[dependencies]
tracing = "0.1"
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
