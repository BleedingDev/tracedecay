[package]
name = "tracedecay-memory-hygiene"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Admitted secret and transient-data hygiene pipeline for TraceDecay provider observations"
repository = "https://github.com/BleedingDev/tracedecay"

[features]
# Opt-in profiling (never in `default`). This crate instruments nothing itself;
# existing feature names forward to the shared detector owner. The binary
# selects the allocation or CPU profiler backend, following upstream policy.
hotpath = ["tracedecay-session-memory/hotpath"]
hotpath-alloc = ["hotpath"]
hotpath-cpu = ["hotpath"]
default = []

[dependencies]
# The provider boundary owns the receipt vocabulary this crate mints into.
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }
# The canonical JSON encoding every digest in this crate is taken over.
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
# The single vendored credential corpus. Duplicating it here is precisely the
# failure this bead exists to prevent, so the detectors are reused through
# the current upstream public owners rather than re-derived.
tracedecay-session-memory = { path = "../tracedecay-session-memory", version = "0.1.0" }
tracedecay-privacy = { path = "../tracedecay-privacy", version = "0.1.0" }

regex = "1.12.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
