[package]
name = "tracedecay-memory-observation"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Durable bounded observation journal, delivery receipts, retention, and replay authority for TraceDecay memory providers"
repository = "https://github.com/BleedingDev/tracedecay"

[dependencies]
# `bundled` mirrors tracedecay-rusqlite-runtime so the journal needs no system
# SQLite. The pinned 0.40.1 matches every other rusqlite consumer in the tree.
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
