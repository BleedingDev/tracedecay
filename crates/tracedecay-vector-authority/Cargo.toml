[package]
name = "tracedecay-vector-authority"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Immutable, source-bound exact-flat vector generation authority"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tracedecay-domain = { path = "../tracedecay-domain" }

[dev-dependencies]
serde_json = "1"
