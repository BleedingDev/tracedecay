[package]
name = "tracedecay-vector-authority"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Immutable, source-bound exact-flat vector generation authority"
repository = "https://github.com/ScriptedAlchemy/tracedecay"

# This crate is intentionally an isolated replacement seam.  The V2 workspace
# is not changed here: callers can opt into the crate after reviewing its
# storage and search contracts.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
