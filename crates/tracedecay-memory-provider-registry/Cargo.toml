[package]
name = "tracedecay-memory-provider-registry"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Product-owned composition for configured TraceDecay memory providers"
repository = "https://github.com/BleedingDev/tracedecay"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
# Canonical context tokenizer. The context-pack compiler measures every token
# budget as an exact `o200k_base` BPE count, under the same estimator identity
# the coding-memory conformance baseline records its admitted-context costs
# with, so a pack budget and a baseline cost are one measurement rather than
# two numbers that share a name. The vendored ranks are compile-time data;
# nothing here reaches the filesystem or the network.
tiktoken-rs = "0.12"
# `rt` for the cancellation bridge task, `sync` for the one-shot handoff the
# host execution boundary answers its caller through, `time` for the
# per-invocation deadline that boundary enforces on a synchronous provider, and
# `macros` for the one biased race that boundary settles worker completion,
# caller cancellation, and the deadline in.
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
# Contract surface only: port traits and value types.
#
# `default-features = false` states this crate's own intent and stops a future
# `default` feature set from widening the edge. It does NOT make the linked
# crate capability-free: Cargo unifies features per compiled crate instance,
# `tracedecay-application` mounts a gix historical-blob reader behind its
# optional `native-git` feature, and crates/tracedecay/Cargo.toml enables that
# feature in the production root graph. What actually bounds this crate is the
# source-import contract in product/architecture/memory-dependency-policy.json,
# which admits an exact list of `tracedecay_application::` item paths and
# refuses `NativeHistoricalBlobReaderV1` and everything else.
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0", default-features = false }
tracedecay-memory-fabric = { path = "../tracedecay-memory-fabric" }
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }
tracedecay-memory-provider-native = { path = "../tracedecay-memory-provider-native" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }
# Test-only edge to the provider-neutral adversarial harness. It depends only
# on the provider API, is never compiled into the shipped crate, and exists so
# the mounted recall and observation-delivery paths are judged against a
# provider double that misbehaves on demand rather than against bespoke
# per-test stubs.
tracedecay-memory-conformance = { path = "../tracedecay-memory-conformance" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
