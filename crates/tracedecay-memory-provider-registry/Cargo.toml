[package]
name = "tracedecay-memory-provider-registry"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Product-owned composition for configured TraceDecay memory providers"
repository = "https://github.com/BleedingDev/tracedecay"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
getrandom = "0.2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt"] }
tracedecay-application = { path = "../tracedecay-application", version = "0.1.0" }
tracedecay-memory-fabric = { path = "../tracedecay-memory-fabric" }
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }
tracedecay-memory-provider-native = { path = "../tracedecay-memory-provider-native" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tracedecay-domain = { path = "../tracedecay-domain", version = "0.1.0" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
