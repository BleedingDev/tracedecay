[package]
name = "tracedecay-memory-conformance"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Provider-neutral conformance and differential evaluation for TraceDecay memory providers"
repository = "https://github.com/BleedingDev/tracedecay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Exact o200k_base token counts for baseline context cost (same pinned release as the agent hosts).
tiktoken-rs = "0.12"
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
