[package]
name = "tracedecay-memory-provider-ncm"
version.workspace = true
edition.workspace = true
publish = false
license = "MIT"
description = "Topology-neutral adapter boundary for licensed NCM cognitive memory"
repository = "https://github.com/BleedingDev/tracedecay"

[features]
default = []
rust-backend = ["dep:tracedecay-memory-ncm-runtime"]
# Pure production declarations for consumers that separately validate live health.
test-helpers = []

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde_json = "1"
sha2 = "0.11"
tracedecay-memory-provider-api = { path = "../tracedecay-memory-provider-api" }
tracedecay-memory-ncm-runtime = { path = "../tracedecay-memory-ncm-runtime", optional = true, default-features = false }

[dev-dependencies]
tracedecay-memory-conformance = { path = "../tracedecay-memory-conformance" }
tracedecay-memory-provider-registry = { path = "../tracedecay-memory-provider-registry" }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
